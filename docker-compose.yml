version: '3.8'

services:
  mus2-app:
    build: .
    expose:
      - "5000"
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: 'False'
      API_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY}
      DATABASE_PATH: /app/drug_recognition.db
      UPLOAD_FOLDER: /app/uploads
      MAX_FILE_SIZE: 10485760
      MIN_CONFIDENCE: '0.3'
      MAX_RESULTS: '5'
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      JWT_ACCESS_EXPIRES: '900'
      JWT_REFRESH_EXPIRES: '604800'
    volumes:
      - ./uploads:/app/uploads
      - ./drug_recognition.db:/app/drug_recognition.db
      - ./medicine_photos:/app/medicine_photos:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      mus2-app:
        condition: service_healthy
    restart: unless-stopped
