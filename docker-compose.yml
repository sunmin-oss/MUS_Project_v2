version: '3.8'

services:
  mus2-app:
    build: .
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: 'False'
      API_PROVIDER: google
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY}
      DATABASE_PATH: /app/drug_recognition.db
      UPLOAD_FOLDER: /app/uploads
      MAX_FILE_SIZE: 10485760
      MIN_CONFIDENCE: '0.3'
      MAX_RESULTS: '5'
    volumes:
      - ./uploads:/app/uploads
      - ./drug_recognition.db:/app/drug_recognition.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

