openapi: "3.0.3"
info:
  title: MUS2 藥物辨識系統 API
  version: "3.0.0"
  description: |
    藥物辨識系統後端 API，提供藥物辨識、用藥管理、安全檢查等功能。
  contact:
    name: MUS2 團隊

servers:
  - url: http://localhost:5000
    description: 開發環境

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        display_name:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    Profile:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
        birth_date:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          enum: [male, female, other]
          nullable: true
        note:
          type: string
          nullable: true
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time

    MedicationSchedule:
      type: object
      properties:
        id:
          type: integer
        time_slot:
          type: string
        scheduled_time:
          type: string
          format: time
          nullable: true
        dose_qty:
          type: number

    Medication:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        profile_id:
          type: integer
        drug_id:
          type: integer
          nullable: true
        name:
          type: string
        dosage:
          type: string
          nullable: true
        unit:
          type: string
          nullable: true
        frequency:
          type: string
        duration_days:
          type: integer
          nullable: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        stock_qty:
          type: integer
          nullable: true
        note:
          type: string
          nullable: true
        is_active:
          type: boolean
        schedules:
          type: array
          items:
            $ref: "#/components/schemas/MedicationSchedule"
        created_at:
          type: string
          format: date-time

    AdherenceLog:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        medication_id:
          type: integer
        schedule_id:
          type: integer
          nullable: true
        status:
          type: string
          enum: [taken, skipped, late]
        taken_at:
          type: string
          format: date-time
          nullable: true
        scheduled_date:
          type: string
          format: date
        note:
          type: string
          nullable: true

    SafetyCheck:
      type: object
      properties:
        overall:
          type: string
          enum: [safe, warning, danger]
        checks:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [allergy, duplicate, interaction, grading]
              status:
                type: string
                enum: [pass, warning, danger]
              details:
                type: array
                items:
                  type: object

    Allergy:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        ingredient_id:
          type: integer
        ingredient_name:
          type: string
        severity:
          type: string
          enum: [mild, moderate, severe]
        note:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

paths:
  /api/health:
    get:
      summary: 健康檢查
      tags: [System]
      responses:
        "200":
          description: 系統正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  timestamp:
                    type: string
                  services:
                    type: object
        "503":
          description: 系統降級

  /api/auth/register:
    post:
      summary: 使用者註冊
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 32
                password:
                  type: string
                  minLength: 8
                display_name:
                  type: string
      responses:
        "201":
          description: 註冊成功
        "400":
          description: 參數錯誤
        "409":
          description: 使用者名稱已存在

  /api/auth/login:
    post:
      summary: 使用者登入
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: 登入成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          description: 帳號或密碼錯誤

  /api/auth/refresh:
    post:
      summary: 刷新 Access Token
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 刷新成功

  /api/auth/logout:
    post:
      summary: 登出（撤銷 Token）
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 登出成功

  /api/auth/me:
    get:
      summary: 取得目前使用者
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    $ref: "#/components/schemas/User"

  /api/auth/profiles:
    get:
      summary: 列出 Profile
      tags: [Profile]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 成功
    post:
      summary: 新增 Profile
      tags: [Profile]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                birth_date:
                  type: string
                  format: date
                gender:
                  type: string
                  enum: [male, female, other]
                note:
                  type: string
      responses:
        "201":
          description: 建立成功

  /api/auth/profiles/{profile_id}:
    put:
      summary: 更新 Profile
      tags: [Profile]
      security:
        - BearerAuth: []
      parameters:
        - name: profile_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                birth_date:
                  type: string
                gender:
                  type: string
                note:
                  type: string
      responses:
        "200":
          description: 更新成功
    delete:
      summary: 刪除 Profile
      tags: [Profile]
      security:
        - BearerAuth: []
      parameters:
        - name: profile_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 刪除成功

  /api/recognize:
    post:
      summary: 藥物辨識
      tags: [Recognition]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                language:
                  type: string
                  default: zh
      responses:
        "200":
          description: 辨識成功
        "400":
          description: 圖片格式錯誤
        "413":
          description: 檔案過大
        "429":
          description: 超過速率限制
        "503":
          description: Vision API 暫不可用

  /api/search:
    post:
      summary: 藥物搜尋
      tags: [Drug]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 2
                limit:
                  type: integer
                  maximum: 20
                  default: 10
      responses:
        "200":
          description: 搜尋成功

  /api/drug/{drug_id}:
    get:
      summary: 藥物詳細資訊
      tags: [Drug]
      parameters:
        - name: drug_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 成功
        "404":
          description: 藥物不存在

  /api/user/medications:
    get:
      summary: 列出用藥
      tags: [Medications]
      security:
        - BearerAuth: []
      parameters:
        - name: profile_id
          in: query
          schema:
            type: integer
        - name: active
          in: query
          schema:
            type: string
            default: "true"
      responses:
        "200":
          description: 成功
    post:
      summary: 新增用藥
      tags: [Medications]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, profile_id]
              properties:
                name:
                  type: string
                profile_id:
                  type: integer
                drug_id:
                  type: integer
                dosage:
                  type: string
                unit:
                  type: string
                frequency:
                  type: string
                  default: daily
                duration_days:
                  type: integer
                start_date:
                  type: string
                  format: date
                end_date:
                  type: string
                  format: date
                stock_qty:
                  type: integer
                note:
                  type: string
                schedules:
                  type: array
                  items:
                    type: object
                    properties:
                      time_slot:
                        type: string
                      scheduled_time:
                        type: string
                      dose_qty:
                        type: number
      responses:
        "201":
          description: 建立成功

  /api/user/medications/{med_id}:
    get:
      summary: 取得單一用藥
      tags: [Medications]
      security:
        - BearerAuth: []
      parameters:
        - name: med_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 成功
    put:
      summary: 更新用藥
      tags: [Medications]
      security:
        - BearerAuth: []
      parameters:
        - name: med_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: 更新成功
    delete:
      summary: 刪除用藥
      tags: [Medications]
      security:
        - BearerAuth: []
      parameters:
        - name: med_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 刪除成功

  /api/user/adherence:
    post:
      summary: 記錄服藥
      tags: [Adherence]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [medication_id, status]
              properties:
                medication_id:
                  type: integer
                status:
                  type: string
                  enum: [taken, skipped, late]
                schedule_id:
                  type: integer
                scheduled_date:
                  type: string
                  format: date
                note:
                  type: string
      responses:
        "201":
          description: 紀錄成功
    get:
      summary: 查詢服藥紀錄
      tags: [Adherence]
      security:
        - BearerAuth: []
      parameters:
        - name: medication_id
          in: query
          schema:
            type: integer
        - name: start
          in: query
          schema:
            type: string
            format: date
        - name: end
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: 成功

  /api/user/adherence/stats:
    get:
      summary: 服藥統計
      tags: [Adherence]
      security:
        - BearerAuth: []
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: 成功

  /api/user/push-token:
    post:
      summary: 註冊推播 Token
      tags: [Push]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token:
                  type: string
                platform:
                  type: string
                  enum: [ios, android, web]
      responses:
        "200":
          description: 註冊成功
    delete:
      summary: 取消推播 Token
      tags: [Push]
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: 取消成功

  /api/safety/check:
    post:
      summary: 安全檢查
      tags: [Safety]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [drug_id]
              properties:
                drug_id:
                  type: integer
                profile_id:
                  type: integer
      responses:
        "200":
          description: 檢查結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  overall:
                    type: string
                  checks:
                    type: array

  /api/safety/interactions:
    get:
      summary: 查詢交互作用
      tags: [Safety]
      security:
        - BearerAuth: []
      parameters:
        - name: ingredient
          in: query
          schema:
            type: string
        - name: severity
          in: query
          schema:
            type: string
            enum: [mild, moderate, severe]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: 成功

  /api/safety/allergies:
    get:
      summary: 列出過敏紀錄
      tags: [Safety]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 成功
    post:
      summary: 新增過敏紀錄
      tags: [Safety]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ingredient_id]
              properties:
                ingredient_id:
                  type: integer
                severity:
                  type: string
                  enum: [mild, moderate, severe]
                  default: moderate
                note:
                  type: string
      responses:
        "201":
          description: 新增成功
        "409":
          description: 已記錄此過敏成分

  /api/safety/allergies/{allergy_id}:
    delete:
      summary: 刪除過敏紀錄
      tags: [Safety]
      security:
        - BearerAuth: []
      parameters:
        - name: allergy_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 刪除成功
