<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>藥知道</title>
    <meta name="description" content="藥知道 - 為年長者設計的簡潔藥物辨識系統">
    <meta name="viewport" content="user-scalable=yes, width=device-width">
    
    <!-- 用於年長者友好的 CSS -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', '微軟正黑體', 'Arial', sans-serif;
            background: #FAF6F0;
            min-height: 100vh;
            padding: 10px;
            color: #222;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #FFFDF9;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #D4851E 0%, #B5722C 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .content {
            padding: 30px 20px;
            min-height: 400px;
        }

        /* ===== 頁面樣式 ===== */
        .page {
            display: none;
        }

        .page.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* ===== 主頁 (HOME) ===== */
        .home-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .big-button {
            background: linear-gradient(135deg, #D4851E 0%, #B5722C 100%);
            color: white;
            border: none;
            padding: 25px 20px;
            border-radius: 15px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(181, 114, 44, 0.4);
            text-decoration: none;
            display: block;
            text-align: center;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .big-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(181, 114, 44, 0.6);
        }

        .big-button:active {
            transform: translateY(-1px);
        }

        .big-button.secondary {
            background: #f0f0f0;
            color: #333;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .big-button.secondary:hover {
            background: #e0e0e0;
        }

        /* ===== 拍照上傳區 ===== */
        .upload-area {
            border: 3px dashed #D4851E;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #FFF8F0;
        }

        .upload-area:hover {
            background: #FFF0E0;
            border-color: #B5722C;
        }

        .upload-area.dragover {
            background: #FFF0E0;
            border-color: #B5722C;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .upload-area p {
            font-size: 20px;
            color: #333;
            margin-bottom: 10px;
        }

        .upload-area small {
            font-size: 14px;
            color: #999;
        }

        #imageInput {
            display: none;
        }

        .image-preview {
            margin-top: 20px;
            text-align: center;
        }

        .image-preview img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* ===== 結果顯示 ===== */
        .results-container {
            margin-top: 20px;
        }

        .result-item {
            background: #FFF8F0;
            border-left: 5px solid #D4851E;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .result-item:hover {
            background: #FFF0E0;
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(181, 114, 44, 0.2);
        }

        .result-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .result-info {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }

        .confidence-bar {
            margin-top: 10px;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #D4851E 0%, #B5722C 100%);
            border-radius: 4px;
        }

        /* ===== 加載動畫 ===== */
        .loading {
            text-align: center;
            padding: 40px 20px;
        }

        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #D4851E;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 18px;
            color: #D4851E;
            font-weight: bold;
        }
        /* ===== 進度條樣式 ===== */
        .progress-container {
            margin: 20px 0;
            padding: 0 20px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #D4851E 0%, #B5722C 100%);
            width: 0%;
            animation: progress 2s ease-in-out infinite;
        }

        @keyframes progress {
            0% { width: 10%; }
            50% { width: 70%; }
            100% { width: 10%; }
        }

        .progress-text {
            font-size: 14px;
            color: #666;
            margin-top: 8px;
            text-align: center;
        }

        /* ===== 按鈕禁用狀態 ===== */
        .big-button:disabled,
        .search-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: #999;
        }

        .big-button:disabled:hover,
        .search-button:disabled:hover {
            transform: none;
        }
        /* ===== 進度條樣式 ===== */
        .progress-container {
            margin: 20px 0;
            padding: 0 20px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #D4851E 0%, #B5722C 100%);
            width: 0%;
            animation: progress 2s ease-in-out infinite;
        }

        @keyframes progress {
            0% {
                width: 10%;
            }
            50% {
                width: 70%;
            }
            100% {
                width: 10%;
            }
        }

        .progress-text {
            font-size: 14px;
            color: #666;
            margin-top: 8px;
            text-align: center;
        }

        /* ===== 按鈕禁用狀態 ===== */
        .big-button:disabled,
        .search-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: #999;
        }

        .big-button:disabled:hover,
        .search-button:disabled:hover {
            transform: none;
        }

        /* ===== 細節頁面 ===== */
        .detail-info {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .detail-label {
            font-size: 14px;
            color: #999;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .detail-value {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            word-break: break-all;
        }

        /* ===== 警告和錯誤 ===== */
        .alert {
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 16px;
            text-align: center;
        }

        .alert.warning {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffeaa7;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        /* ===== 搜尋功能 ===== */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            border-color: #D4851E;
        }

        .search-button {
            padding: 15px 25px;
            background: #D4851E;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .search-button:hover {
            background: #B5722C;
            transform: translateY(-2px);
        }

        /* ===== 返回按鈕 ===== */
        .back-button {
            background: #6c757d;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 20px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .back-button:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        /* ===== 底部提示 ===== */
        .footer-hint {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        /* ===== 響應式設計 ===== */
        @media (max-width: 480px) {
            .header h1 {
                font-size: 28px;
            }

            .big-button {
                font-size: 20px;
                padding: 20px;
                min-height: 70px;
            }

            .content {
                padding: 20px 15px;
            }
        }

        /* ===== 設定按鈕 ===== */
        .settings-toggle {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            font-size: 22px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
            z-index: 10;
        }
        .settings-toggle:hover { background: rgba(255,255,255,0.35); }

        /* ===== 設定面板 ===== */
        .settings-panel {
            display: none;
            position: absolute;
            top: 56px;
            right: 12px;
            background: #fff;
            color: #333;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
            padding: 18px;
            width: 260px;
            z-index: 20;
            animation: fadeIn 0.2s;
        }
        .settings-panel.show { display: block; }
        .settings-panel h4 { font-size: 15px; margin-bottom: 12px; color: #555; }
        .settings-section { margin-bottom: 16px; }
        .settings-section:last-child { margin-bottom: 0; }
        .settings-label { font-size: 13px; font-weight: 600; color: #666; margin-bottom: 6px; }

        .opt-group { display: flex; gap: 6px; }
        .opt-btn {
            flex: 1;
            padding: 8px 4px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: #f8f8f8;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            transition: all 0.2s;
            font-family: inherit;
            color: #333;
        }
        .opt-btn:hover { border-color: #aaa; }
        .opt-btn.active { border-color: #D4851E; background: #FFF0E0; color: #B5722C; font-weight: 700; }

        .theme-btn {
            flex: 1;
            height: 36px;
            border: 3px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .theme-btn:hover { transform: scale(1.05); }
        .theme-btn.active { border-color: #D4851E; box-shadow: 0 0 0 2px rgba(212,133,30,0.3); }
        .theme-default { background: linear-gradient(135deg, #D4851E, #B5722C); }
        .theme-warm { background: linear-gradient(135deg, #f5af19, #f12711); }
        .theme-dark { background: linear-gradient(135deg, #232526, #414345); }

        .admin-entry-btn {
            width: 100%;
            padding: 10px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            color: #555;
            transition: all 0.2s;
        }
        .admin-entry-btn:hover { background: #e8e8e8; color: #333; }

        /* ===== 登入對話框 ===== */
        .login-backdrop {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }
        .login-backdrop.show { display: flex; }
        .login-modal {
            background: #fff;
            border-radius: 16px;
            padding: 28px;
            width: 320px;
            text-align: center;
            animation: fadeIn 0.2s;
        }
        .login-modal h3 { font-size: 20px; margin-bottom: 18px; color: #333; }
        .login-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 12px;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        .login-input:focus { outline: none; border-color: #D4851E; }
        .login-error { color: #ea4335; font-size: 13px; margin-bottom: 10px; display: none; }
        .login-actions { display: flex; gap: 10px; }
        .login-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }
        .login-cancel { background: #f0f0f0; color: #555; }
        .login-submit { background: linear-gradient(135deg, #D4851E, #B5722C); color: #fff; }

        /* ===== 字體大小模式 ===== */
        body.font-medium { font-size: 18px; }
        body.font-medium .header h1 { font-size: 40px; }
        body.font-medium .big-button { font-size: 26px; }
        body.font-medium .back-button { font-size: 18px; }
        body.font-medium .upload-area p { font-size: 22px; }
        body.font-medium .search-input { font-size: 20px; }

        body.font-large { font-size: 22px; }
        body.font-large .header h1 { font-size: 46px; }
        body.font-large .big-button { font-size: 30px; padding: 30px; }
        body.font-large .back-button { font-size: 20px; padding: 18px; }
        body.font-large .upload-area p { font-size: 26px; }
        body.font-large .search-input { font-size: 24px; }
        body.font-large .result-item { font-size: 20px; }

        /* ===== 暖色對比主題 ===== */
        body.theme-warm-mode { background: linear-gradient(135deg, #f5af19 0%, #f12711 100%); }
        body.theme-warm-mode .header { background: linear-gradient(135deg, #f5af19 0%, #f12711 100%); }
        body.theme-warm-mode .big-button { background: linear-gradient(135deg, #f5af19 0%, #f12711 100%); box-shadow: 0 4px 15px rgba(241,39,17,0.4); }
        body.theme-warm-mode .upload-area { border-color: #f5af19; }
        body.theme-warm-mode .upload-area:hover { border-color: #f12711; background: #fff8f0; }

        /* ===== 深色高對比主題 ===== */
        body.theme-dark-mode { background: #1a1a1a; }
        body.theme-dark-mode .container { background: #2a2a2a; color: #f0f0f0; }
        body.theme-dark-mode .header { background: linear-gradient(135deg, #232526 0%, #414345 100%); }
        body.theme-dark-mode .big-button { background: linear-gradient(135deg, #434343 0%, #000000 100%); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        body.theme-dark-mode .big-button.secondary { background: #444; color: #fff; }
        body.theme-dark-mode .upload-area { background: #333; border-color: #666; color: #ddd; }
        body.theme-dark-mode .upload-area:hover { background: #3a3a3a; border-color: #888; }
        body.theme-dark-mode .upload-area p { color: #ddd; }
        body.theme-dark-mode .back-button { background: #555; }
        body.theme-dark-mode .search-input { background: #333; color: #fff; border-color: #555; }
        body.theme-dark-mode .footer-hint { color: #888; border-top-color: #444; }
        body.theme-dark-mode .result-item { background: #333; }
        body.theme-dark-mode .settings-panel { background: #333; color: #eee; }
        body.theme-dark-mode .settings-label { color: #bbb; }
        body.theme-dark-mode .opt-btn { background: #444; color: #ddd; border-color: #555; }
        body.theme-dark-mode .opt-btn.active { border-color: #88a0ff; background: #3a3a5a; color: #88a0ff; }
        body.theme-dark-mode .admin-entry-btn { background: #444; color: #ccc; border-color: #555; }
    </style>
</head>

<body>
    <div class="container">
        <!-- 頁首 -->
        <div class="header" style="position:relative;">
            <h1>💊 藥知道</h1>
            <p>簡單、快速、安全</p>
            <button class="settings-toggle" onclick="toggleSettings()" title="設定">⚙️</button>
            <div class="settings-panel" id="settingsPanel">
                <div class="settings-section">
                    <div class="settings-label">字體大小</div>
                    <div class="opt-group">
                        <button class="opt-btn active" data-font="normal" onclick="setFontSize('normal')">正常</button>
                        <button class="opt-btn" data-font="medium" onclick="setFontSize('medium')">中</button>
                        <button class="opt-btn" data-font="large" onclick="setFontSize('large')">大</button>
                    </div>
                </div>
                <div class="settings-section">
                    <div class="settings-label">顏色主題</div>
                    <div class="opt-group">
                        <div class="theme-btn theme-default active" data-theme="default" onclick="setTheme('default')" title="預設"></div>
                        <div class="theme-btn theme-warm" data-theme="warm" onclick="setTheme('warm')" title="暖色"></div>
                        <div class="theme-btn theme-dark" data-theme="dark" onclick="setTheme('dark')" title="深色高對比"></div>
                    </div>
                </div>
                <div class="settings-section">
                    <button class="admin-entry-btn" onclick="showLoginModal()">🔒 進入後台管理</button>
                </div>
            </div>
        </div>

        <!-- 主頁 -->
        <div class="content page active" id="homePage">
            <div class="home-buttons">
                <button class="big-button" onclick="goToPage('capturePage')">
                    📷 拍照辨識藥物
                </button>
                <button class="big-button" style="background: linear-gradient(135deg, #C47A1A 0%, #A0622E 100%);" onclick="goToPage('prescriptionCapturePage')">
                    📄 拍攝藥單辨識
                </button>
                <button class="big-button" style="background: linear-gradient(135deg, #E8A84C 0%, #D4851E 100%);" onclick="goToPage('searchPage')">
                    🔍 搜尋藥物名稱
                </button>
            </div>
            <div class="footer-hint">
                <p>💡 提示：請在光線充足的地方，對準藥物清晰拍照</p>
            </div>
        </div>

        <!-- 拍照上傳頁 -->
        <div class="content page" id="capturePage">
            <button class="back-button" onclick="goToPage('homePage')">← 返回首頁</button>

            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📸</div>
                <p>點擊選擇圖片或拖放</p>
                <small>支援 JPG, PNG, GIF 等格式</small>
            </div>

            <div id="imagePreview" class="image-preview" style="display: none;">
                <img id="previewImage" alt="preview">
                <button id="uploadBtn" class="big-button" style="margin-top: 20px; background: #28a745;" onclick="uploadImage()">
                    ✓ 開始辨識
                </button>
                <button class="big-button secondary" style="margin-top: 12px;" onclick="resetAndRephoto()">
                    ↺ 重新拍照
                </button>
            </div>

            <input type="file" id="imageInput" accept="image/*">
        </div>

        <!-- 藥單拍照上傳頁 -->
        <div class="content page" id="prescriptionCapturePage">
            <button class="back-button" onclick="goToPage('homePage')">← 返回首頁</button>

            <div class="upload-area" id="prescriptionUploadArea">
                <div class="upload-icon">📄</div>
                <p>點擊上傳藥單照片</p>
                <small>支援整張醫院藥單/處方箋</small>
            </div>

            <div id="prescriptionImagePreview" class="image-preview" style="display: none;">
                <img id="prescriptionPreviewImg" alt="preview">
                <button id="prescriptionUploadBtn" class="big-button" style="margin-top: 20px; background: #28a745;" onclick="uploadPrescriptionImage()">
                    ✓ 開始提取藥物
                </button>
                <button class="big-button secondary" style="margin-top: 12px;" onclick="resetPrescriptionPhoto()">
                    ↺ 重新拍照
                </button>
            </div>

            <input type="file" id="prescriptionImageInput" accept="image/*">
        </div>

        <!-- 辨識結果頁 -->
        <div class="content page" id="resultPage">
            <button class="back-button" onclick="goToPage('homePage')">← 返回首頁</button>

            <div id="resultContent"></div>
        </div>

        <!-- 搜尋頁 -->
        <div class="content page" id="searchPage">
            <button class="back-button" onclick="goToPage('homePage')">← 返回首頁</button>

            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="輸入藥物名稱..." 
                    onkeypress="if(event.key==='Enter') searchDrug()">
                <button id="searchBtn" class="search-button" onclick="searchDrug()">搜尋</button>
            </div>

            <div id="searchResults"></div>
        </div>

        <!-- 藥物詳細頁 -->
        <div class="content page" id="detailPage">
            <button class="back-button" onclick="goToPreviousPage()">← 返回</button>

            <div id="detailContent"></div>
        </div>
    </div>

    <!-- 管理員登入對話框 -->
    <div class="login-backdrop" id="loginBackdrop" onclick="if(event.target===this)closeLoginModal()">
        <div class="login-modal">
            <h3>🔒 管理員登入</h3>
            <input type="text" class="login-input" id="loginUser" placeholder="帳號" autocomplete="username">
            <input type="password" class="login-input" id="loginPass" placeholder="密碼" autocomplete="current-password"
                onkeydown="if(event.key==='Enter')doLogin()">
            <div class="login-error" id="loginError">帳號或密碼錯誤</div>
            <div class="login-actions">
                <button class="login-cancel" onclick="closeLoginModal()">取消</button>
                <button class="login-submit" onclick="doLogin()">登入</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // 全局狀態 (必須在最開始初始化)
        // ============================================
        var API_URL = 'http://localhost:5000/api';
        var currentPage = 'homePage';
        var previousPage = 'homePage';
        var selectedFile = null;

        // ============================================
        // 頁面導航
        // ============================================
        function goToPage(pageId) {
            console.log('🔄 切換頁面:', pageId);
            previousPage = currentPage;
            currentPage = pageId;
            
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
            const targetPage = document.getElementById(pageId);
            if (targetPage) {
                targetPage.classList.add('active');
            } else {
                console.error('❌ 頁面不存在:', pageId);
            }
        }

        function goToPreviousPage() {
            goToPage(previousPage);
        }

        // ============================================
        // 藥單上傳
        // ============================================
        var prescriptionFile = null;

        function initPrescriptionUploadArea() {
            const uploadArea = document.getElementById('prescriptionUploadArea');
            const imageInput = document.getElementById('prescriptionImageInput');

            if (!uploadArea || !imageInput) return;

            uploadArea.addEventListener('click', () => imageInput.click());
            
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });
            uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                if (e.dataTransfer.files[0]) handlePrescriptionFile(e.dataTransfer.files[0]);
            });

            imageInput.addEventListener('change', (e) => {
                if (e.target.files[0]) handlePrescriptionFile(e.target.files[0]);
            });
        }

        function handlePrescriptionFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('請選擇圖片檔案');
                return;
            }
            prescriptionFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('prescriptionPreviewImg').src = e.target.result;
                document.getElementById('prescriptionImagePreview').style.display = 'block';
                document.getElementById('prescriptionUploadArea').style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        function resetPrescriptionPhoto() {
            prescriptionFile = null;
            document.getElementById('prescriptionImageInput').value = '';
            document.getElementById('prescriptionImagePreview').style.display = 'none';
            document.getElementById('prescriptionUploadArea').style.display = 'block';
            goToPage('prescriptionCapturePage');
        }

        async function uploadPrescriptionImage() {
            if (!prescriptionFile) {
                alert('請先選擇圖片');
                return;
            }

            const uploadBtn = document.getElementById('prescriptionUploadBtn');
            if (uploadBtn) uploadBtn.disabled = true;

            showLoading('正在擷取藥單內容...\n請稍候片刻...');
            goToPage('resultPage');

            try {
                const formData = new FormData();
                formData.append('image', prescriptionFile);

                const response = await fetch(`${API_URL}/recognize_prescription`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success && data.recognized_items && data.recognized_items.length > 0) {
                    displayResults(data.recognized_items);
                } else {
                    showError(data.error || '未能從藥單中識別出任何藥物\n\n請拍清楚藥單上的藥物名稱');
                }
            } catch (error) {
                showError('網路連線失敗\n\n請檢查網路後重試');
            } finally {
                if (uploadBtn) uploadBtn.disabled = false;
            }
        }

        // ============================================
        // 檔案上傳
        // ============================================
        function initUploadArea() {
            const uploadArea = document.getElementById('uploadArea');
            const imageInput = document.getElementById('imageInput');
            const imagePreview = document.getElementById('imagePreview');
            const previewImage = document.getElementById('previewImage');

            if (!uploadArea || !imageInput || !imagePreview || !previewImage) {
                console.error('❌ 上傳區元素未找到');
                return;
            }

            // 點擊上傳區
            uploadArea.addEventListener('click', () => {
                console.log('📁 點擊上傳區');
                imageInput.click();
            });

            // 拖放
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });

            uploadArea.addEventListener('dragleave', () => {
                uploadArea.classList.remove('dragover');
            });

            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                if (e.dataTransfer.files[0]) {
                    handleFileSelect(e.dataTransfer.files[0]);
                }
            });

            // 檔案輸入
            imageInput.addEventListener('change', (e) => {
                if (e.target.files[0]) {
                    handleFileSelect(e.target.files[0]);
                }
            });
        }

        function handleFileSelect(file) {
            if (!file.type.startsWith('image/')) {
                alert('請選擇圖片檔案');
                return;
            }

            selectedFile = file;

            // 顯示預覽
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                imagePreview.style.display = 'block';
                uploadArea.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        // ============================================
        // 上傳和辨識
        // ============================================
        async function uploadImage() {
            console.log('📤 開始上傳圖片');
            
            if (!selectedFile) {
                alert('請先選擇圖片');
                return;
            }

            // 禁用按鈕
            const uploadBtn = document.getElementById('uploadBtn');
            if (uploadBtn) uploadBtn.disabled = true;

            showLoading('正在辨識圖片中...\n請稍候...');
            goToPage('resultPage');

            try {
                const formData = new FormData();
                formData.append('image', selectedFile);

                console.log(`📡 呼叫 API: ${API_URL}/recognize`);
                const response = await fetch(`${API_URL}/recognize`, {
                    method: 'POST',
                    body: formData
                });

                console.log('✓ API 回應:', response.status);
                const data = await response.json();

                if (data.success && data.recognized_items && data.recognized_items.length > 0) {
                    console.log('✓ 辨識成功:', data.recognized_items.length, '項');
                    displayResults(data.recognized_items);
                } else {
                    console.warn('⚠ 未能識別出藥物');
                    showError('未能識別出藥物\n\n請嘗試：\n1. 更換光線條件\n2. 拍攝更清晰的照片\n3. 靠近藥物');
                }
            } catch (error) {
                console.error('❌ 辨識失敗:', error);
                showError('網路連線失敗\n\n請檢查網路後重試');
            } finally {
                // 重新啟用按鈕
                if (uploadBtn) uploadBtn.disabled = false;
            }
        }

        // ============================================
        // 搜尋
        // ============================================
        async function searchDrug() {
            console.log('🔍 開始搜尋');
            
            const searchInput = document.getElementById('searchInput');
            if (!searchInput) {
                console.error('❌ 搜尋框未找到');
                return;
            }
            
            const query = searchInput.value.trim();

            if (!query || query.length < 2) {
                alert('請輸入至少 2 個字符');
                return;
            }

            // 禁用按鈕和輸入框
            const searchBtn = document.getElementById('searchBtn');
            if (searchBtn) searchBtn.disabled = true;
            searchInput.disabled = true;

            showSearchLoading('搜尋中...');

            try {
                console.log(`📡 呼叫 API: ${API_URL}/search，查詢: ${query}`);
                const response = await fetch(`${API_URL}/search`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query, limit: 10 })
                });

                console.log('✓ API 回應:', response.status);
                const data = await response.json();

                if (data.success && data.results && data.results.length > 0) {
                    console.log('✓ 搜尋成功:', data.results.length, '項');
                    displaySearchResults(data.results);
                } else {
                    console.warn('⚠ 未找到相符結果');
                    const searchResults = document.getElementById('searchResults');
                    if (searchResults) {
                        searchResults.innerHTML = '<div class="alert warning">未找到相符的藥物</div>';
                    }
                }
            } catch (error) {
                console.error('❌ 搜尋失敗:', error);
                const searchResults = document.getElementById('searchResults');
                if (searchResults) {
                    searchResults.innerHTML = '<div class="alert error">搜尋失敗，請重試</div>';
                }
            } finally {
                // 重新啟用按鈕和輸入框
                if (searchBtn) searchBtn.disabled = false;
                searchInput.disabled = false;
            }
        }

        // ============================================
        // 顯示結果
        // ============================================
        function displayResults(items) {
            let html = '<div class="results-container">';

            if (items.length === 0) {
                html += '<div class="alert warning">未找到相符結果</div>';
            } else {
                items.forEach((item, index) => {
                    const confidence = (item.confidence * 100).toFixed(0);
                    
                    // 取得第一張圖片
                    let imageHtml = '';
                    if (item.images && item.images.length > 0) {
                        const firstImage = item.images[0];
                        const imagePath = firstImage.path.replace(/\\/g, '/');
                        imageHtml = `<img src="/api/images/${imagePath}" alt="${item.name}" class="drug-image" style="max-width: 150px; max-height: 150px; margin: 10px 0; border-radius: 8px;">`;
                    }
                    
                    html += `
                        <div class="result-item" onclick="loadAndShowDrugDetail(${item.id || item.drug_id || 'null'}, ${JSON.stringify(item).replace(/"/g, '&quot;')})">
                            ${imageHtml}
                            <div class="result-title">${item.name}</div>
                            <div class="result-info">
                                <div>匹配度：${confidence}%</div>
                                ${item.details?.chinese_name ? `<div>中文名稱：${item.details.chinese_name}</div>` : ''}
                                ${item.details?.shape ? `<div>形狀：${item.details.shape}</div>` : ''}
                                ${item.details?.color ? `<div>顏色：${item.details.color}</div>` : ''}
                            </div>
                            <div class="confidence-bar">
                                <div class="confidence-fill" style="width: ${confidence}%"></div>
                            </div>
                        </div>
                    `;
                });
            }

            html += `
                <div style="margin-top: 30px;">
                    <button class="big-button" style="background: #6c757d; margin-bottom: 15px;" onclick="resetAndRephoto()">
                        📸 重新拍照
                    </button>
                    <button class="big-button secondary" onclick="goToPage('homePage')">
                        ← 返回首頁
                    </button>
                </div>
            </div>`;
            document.getElementById('resultContent').innerHTML = html;
        }

        function resetAndRephoto() {
            console.log('🔄 重新拍照');
            selectedFile = null;
            document.getElementById('imageInput').value = '';
            const imagePreview = document.getElementById('imagePreview');
            const uploadArea = document.getElementById('uploadArea');
            if (imagePreview) imagePreview.style.display = 'none';
            if (uploadArea) uploadArea.style.display = 'block';
            goToPage('capturePage');
        }

        function displaySearchResults(results) {
            let html = '<div class="results-container">';

            results.forEach(drug => {
                // 顯示圖片
                let imageHtml = '';
                if (drug.images && drug.images.length > 0) {
                    const firstImage = drug.images[0];
                    const imagePath = firstImage.path.replace(/\\/g, '/');
                    imageHtml = `<img src="/api/images/${imagePath}" alt="${drug.chinese_name || drug.name || '藥物圖片'}" class="drug-image" style="max-width: 150px; max-height: 150px; margin: 10px 0; border-radius: 8px;">`;
                }
                
                html += `
                    <div class="result-item" onclick="loadAndShowDrugDetail(${drug.id || drug.drug_id || 'null'}, ${JSON.stringify(drug).replace(/"/g, '&quot;')})">
                        ${imageHtml}
                        <div class="result-title">${drug.chinese_name || drug.name || '未知'}</div>
                        <div class="result-info">
                            ${drug.english_name ? `<div>English: ${drug.english_name}</div>` : ''}
                            ${drug.license_number ? `<div>許可證: ${drug.license_number}</div>` : ''}
                            ${drug.shape ? `<div>形狀：${drug.shape}</div>` : ''}
                            ${drug.color ? `<div>顏色：${drug.color}</div>` : ''}
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            document.getElementById('searchResults').innerHTML = html;
        }

        async function loadAndShowDrugDetail(drugId, fallbackDrug) {
            goToPage('detailPage');
            document.getElementById('detailContent').innerHTML = `
                <div class="loading" style="text-align: center; padding: 40px 20px;">
                    <div class="spinner" style="display: inline-block; width: 50px; height: 50px; border: 4px solid #f3f3f3; border-top: 4px solid #D4851E; border-radius: 50%; animation: spin 1s linear infinite;"></div>
                    <div class="loading-text" style="color: #D4851E; font-weight: bold; margin-top: 20px;">
                        正在擷取最新藥物資訊<br><small style="font-size:14px; color:#999;">(包含健保署/食藥署資料)</small>
                    </div>
                </div>
            `;
            
            try {
                if (drugId) {
                    const response = await fetch(`${API_URL}/drug/${drugId}`);
                    const data = await response.json();
                    if (data.success && data.drug) {
                        showDrugDetail(data.drug);
                        return;
                    }
                }
                showDrugDetail(fallbackDrug);
            } catch (e) {
                showDrugDetail(fallbackDrug);
            }
        }

        function showDrugDetail(drug) {
            let html = '<div>';
            
            const details = drug.details || drug;
            const nhiDetails = drug.nhi_details || {};
            
            const displayName = nhiDetails['中文品名'] || details.chinese_name || details.name || drug.name || '藥物詳情';
            
            html += `<h2 style="font-size: 24px; margin-bottom: 20px; color: #333;">${displayName}</h2>`;

            if (Object.keys(nhiDetails).length > 0) {
                html += `
                <div style="margin-bottom: 15px; padding: 12px; background: #e3f2fd; border-left: 4px solid #1976d2; border-radius: 4px;">
                    <strong style="color: #1565c0; display: block; margin-bottom: 4px;">ℹ️ 最新資訊來源</strong>
                    <span style="font-size: 14px; color: #333;">部分資料同步自 <a href="${nhiDetails.source_url || '#'}" target="_blank" style="color:#1976d2;">食藥署/健保署資料庫</a></span>
                </div>`;
            }

            // 顯示圖片
            let allImages = [];
            if (drug.images && drug.images.length > 0) {
                allImages = allImages.concat(drug.images.map(img => `/api/images/${img.path.replace(/\\/g, '/')}`));
            }
            if (nhiDetails.images && nhiDetails.images.length > 0) {
                allImages = allImages.concat(nhiDetails.images);
            }

            if (allImages.length > 0) {
                html += '<div style="margin-bottom: 20px; text-align: center;">';
                allImages.forEach(imgSrc => {
                    html += `<img src="${imgSrc}" alt="${displayName}" style="max-width: 200px; max-height: 200px; margin: 10px; border-radius: 8px; border: 1px solid #ddd; padding: 5px;">`;
                });
                html += '</div>';
            }

            html += `
                <div class="detail-info">
                    <div class="detail-label">中文名稱</div>
                    <div class="detail-value">${nhiDetails['中文品名'] || details.chinese_name || '-'}</div>
                </div>

                <div class="detail-info">
                    <div class="detail-label">英文名稱</div>
                    <div class="detail-value">${nhiDetails['英文品名'] || details.english_name || '-'}</div>
                </div>
            `;
            
            if (nhiDetails['適應症']) {
                html += `
                <div class="detail-info">
                    <div class="detail-label">適應症</div>
                    <div class="detail-value">${nhiDetails['適應症']}</div>
                </div>`;
            } else {
                html += `
                <div class="detail-info">
                    <div class="detail-label">用途</div>
                    <div class="detail-value">${details.usage || details.indication || '-'}</div>
                </div>`;
            }

            if (nhiDetails['主成分略述']) {
                html += `
                <div class="detail-info">
                    <div class="detail-label">主成分</div>
                    <div class="detail-value">${nhiDetails['主成分略述']}</div>
                </div>`;
            }

            html += `
                <div class="detail-info">
                    <div class="detail-label">許可證字號</div>
                    <div class="detail-value">${details.license_number || '-'}</div>
                </div>

                <div class="detail-info">
                    <div class="detail-label">形狀</div>
                    <div class="detail-value">${details.shape || '-'}</div>
                </div>

                <div class="detail-info">
                    <div class="detail-label">顏色</div>
                    <div class="detail-value">${details.color || '-'}</div>
                </div>

                <div class="detail-info">
                    <div class="detail-label">劑型</div>
                    <div class="detail-value">${nhiDetails['藥品類別'] || details.formulation || details.dosage_form || '-'}</div>
                </div>

                <div class="alert warning" style="margin-top: 20px;">
                    <strong>⚠️ 重要提醒</strong><br>
                    此資訊僅供參考。購買、服用或停用任何藥物前，請務必<strong>諮詢您的醫生或藥師</strong>。
                </div>
            </div>`;

            document.getElementById('detailContent').innerHTML = html;
        }

        // ============================================
        // 輔助函式
        // ============================================
        function showLoading(message) {
            const resultContent = document.getElementById('resultContent');
            if (!resultContent) {
                console.error('❌ resultContent 未找到');
                return;
            }
            
            const messageHtml = message.split('\n').map(line => {
                return `<div>${line}</div>`;
            }).join('');
            
            resultContent.innerHTML = `
                <div class="loading" style="text-align: center; padding: 40px 20px;">
                    <div class="spinner" style="display: inline-block; width: 60px; height: 60px; border: 4px solid #f3f3f3; border-top: 4px solid #D4851E; border-radius: 50%; animation: spin 1s linear infinite;"></div>
                    <div class="progress-container">
                        <div class="progress-bar">
                            <div class="progress-fill"></div>
                        </div>
                        <div class="progress-text">處理中...</div>
                    </div>
                    <div class="loading-text" style="margin-top: 20px; font-size: 18px; color: #333;">
                        ${messageHtml}
                    </div>
                </div>
            `;
        }

        function showSearchLoading(message) {
            const searchResults = document.getElementById('searchResults');
            if (!searchResults) {
                console.error('❌ searchResults 未找到');
                return;
            }
            
            searchResults.innerHTML = `
                <div class="loading" style="text-align: center; padding: 40px 20px;">
                    <div class="spinner" style="display: inline-block; width: 50px; height: 50px; border: 4px solid #f3f3f3; border-top: 4px solid #D4851E; border-radius: 50%; animation: spin 1s linear infinite;"></div>
                    <div class="progress-container">
                        <div class="progress-bar">
                            <div class="progress-fill"></div>
                        </div>
                        <div class="progress-text">搜尋中...</div>
                    </div>
                    <div class="loading-text" style="margin-top: 20px; font-size: 16px; color: #333;">
                        ${message}
                    </div>
                </div>
            `;
        }

        function showError(message) {
            const resultContent = document.getElementById('resultContent');
            if (!resultContent) {
                console.error('❌ resultContent 未找到');
                return;
            }
            
            const messageHtml = message.split('\n').map(line => {
                return `<div>${line}</div>`;
            }).join('<br>');
            
            resultContent.innerHTML = `
                <div class="alert error" style="font-size: 18px; padding: 30px 20px; margin-bottom: 20px;">
                    ${messageHtml}
                </div>
                <button class="big-button" style="margin-top: 20px;" onclick="goToPage('capturePage')">
                    ↺ 重新拍照
                </button>
            `;
        }

        // ============================================
        // 初始化
        // ============================================
        function initApp() {
            console.log('🚀 應用初始化中...');
            console.log(`📡 API URL: ${API_URL}`);
            
            // 初始化上傳區
            initUploadArea();
            initPrescriptionUploadArea();
            
            // 設置搜尋框的 Enter 鍵事件
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        searchDrug();
                    }
                });
            }
            
            console.log('✓ 應用已載入，可以開始使用');
        }
        
        // ============================================
        // 設定功能
        // ============================================
        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('show');
        }
        // 點擊外部關閉設定
        document.addEventListener('click', function(e) {
            const panel = document.getElementById('settingsPanel');
            const toggle = document.querySelector('.settings-toggle');
            if (panel && !panel.contains(e.target) && e.target !== toggle) {
                panel.classList.remove('show');
            }
        });

        function setFontSize(size) {
            document.body.classList.remove('font-medium', 'font-large');
            if (size === 'medium') document.body.classList.add('font-medium');
            if (size === 'large') document.body.classList.add('font-large');
            document.querySelectorAll('.opt-btn[data-font]').forEach(b => b.classList.remove('active'));
            document.querySelector('.opt-btn[data-font="' + size + '"]').classList.add('active');
            localStorage.setItem('mus2_font', size);
        }

        function setTheme(theme) {
            document.body.classList.remove('theme-warm-mode', 'theme-dark-mode');
            if (theme === 'warm') document.body.classList.add('theme-warm-mode');
            if (theme === 'dark') document.body.classList.add('theme-dark-mode');
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.theme-btn[data-theme="' + theme + '"]').classList.add('active');
            localStorage.setItem('mus2_theme', theme);
        }

        // 載入儲存的設定
        (function loadSavedSettings() {
            const font = localStorage.getItem('mus2_font');
            if (font && font !== 'normal') setFontSize(font);
            const theme = localStorage.getItem('mus2_theme');
            if (theme && theme !== 'default') setTheme(theme);
        })();

        // ============================================
        // 管理員登入
        // ============================================
        function showLoginModal() {
            document.getElementById('settingsPanel').classList.remove('show');
            document.getElementById('loginBackdrop').classList.add('show');
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
            document.getElementById('loginError').style.display = 'none';
            setTimeout(() => document.getElementById('loginUser').focus(), 100);
        }

        function closeLoginModal() {
            document.getElementById('loginBackdrop').classList.remove('show');
        }

        function doLogin() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value;
            if (user === 'admin' && pass === 'admin') {
                closeLoginModal();
                window.location.href = '/admin/';
            } else {
                document.getElementById('loginError').style.display = 'block';
                document.getElementById('loginPass').value = '';
                document.getElementById('loginPass').focus();
            }
        }
        
        // 在 DOM 加載完成後初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            // 如果腳本在 DOM 加載完成後執行
            initApp();
        }
    </script>
</body>

</html>
